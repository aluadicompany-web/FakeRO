<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-label="ผังหน้าที่อาคาร Central"><rect width="1400" height="1100" fill="#edf5ed"/><text x="700" y="40" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#274858">CENTRAL · FUNCTIONAL LAYOUT</text><text x="700" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#547061">ผังการใช้งานอาคาร · ข้อเสนอ · ไม่ใช่ภาพฉากสุดท้าย · ทั้งเมืองห้าม PvP</text><ellipse cx="700" cy="555" rx="570" ry="435" fill="#dcebd9" stroke="#658e7b" stroke-width="10"/><circle cx="700" cy="555" r="245" fill="none" stroke="#faf2cf" stroke-width="48"/><circle cx="700" cy="555" r="243" fill="none" stroke="#cbbb8b" stroke-width="1"/><path d="M700 555 L700.0 125.0" stroke="#faf2cf" stroke-width="28"/><circle cx="700.0" cy="125.0" r="20" fill="#537b78"/><text x="700.0" y="130.0" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">G1</text><path d="M700 555 L1189.3 340.0" stroke="#faf2cf" stroke-width="28"/><circle cx="1189.3" cy="340.0" r="20" fill="#537b78"/><text x="1189.3" y="345.0" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">G2</text><path d="M700 555 L1189.3 770.0" stroke="#faf2cf" stroke-width="28"/><circle cx="1189.3" cy="770.0" r="20" fill="#537b78"/><text x="1189.3" y="775.0" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">G3</text><path d="M700 555 L700.0 985.0" stroke="#faf2cf" stroke-width="28"/><circle cx="700.0" cy="985.0" r="20" fill="#537b78"/><text x="700.0" y="990.0" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">G4</text><path d="M700 555 L210.7 770.0" stroke="#faf2cf" stroke-width="28"/><circle cx="210.7" cy="770.0" r="20" fill="#537b78"/><text x="210.7" y="775.0" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">G5</text><path d="M700 555 L210.7 340.0" stroke="#faf2cf" stroke-width="28"/><circle cx="210.7" cy="340.0" r="20" fill="#537b78"/><text x="210.7" y="345.0" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">G6</text><g id="market"><title>ร้านเช่าและพื้นที่พ่อค้า รวมประกาศสินค้ากับบริการช่าง</title><rect x="780.5" y="212.2" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="800.5" cy="232.2" r="12" fill="#52798a"/><text x="800.5" y="236.2" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">2</text><text x="882.5" y="260.2" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ตลาด Silfr</text></g><g id="forge"><title>พื้นที่ช่างผู้เล่นเปิดบริการและสถานีผลิต ไม่ให้NPCแทนผู้สร้างของแดง</title><rect x="780.5" y="300.2" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="800.5" cy="320.2" r="12" fill="#52798a"/><text x="800.5" y="324.2" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">3</text><text x="882.5" y="348.2" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ลานเตาหลอม</text></g><g id="warehouse"><title>จุดบริการฝากของ รูปแบบคลังส่วนตัว/บัญชียังรอกำหนด</title><rect x="963.0" y="472.0" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="983.0" cy="492.0" r="12" fill="#52798a"/><text x="983.0" y="496.0" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">4</text><text x="1065.0" y="520.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">คลังกลาง</text></g><g id="waygate"><title>NPCไปจุดที่ตัวละครเคยค้นพบแล้ว ไม่ปลดล็อกเมืองฟรีทุกแห่ง</title><rect x="963.0" y="560.0" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="983.0" cy="580.0" r="12" fill="#52798a"/><text x="983.0" y="584.0" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">5</text><text x="1065.0" y="608.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ลานวาร์ป</text></g><g id="inn"><title>จุดพักและตั้งเมืองเกิดตามระบบที่จะกำหนด</title><rect x="780.5" y="731.8" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="800.5" cy="751.8" r="12" fill="#52798a"/><text x="800.5" y="755.8" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">6</text><text x="882.5" y="779.8" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">โรงเตี๊ยมและจุดบันทึก</text></g><g id="supplies"><title>ยาพื้นฐานและเครื่องมือ ซื้อขายด้วยSilfrตามกฎราคา</title><rect x="780.5" y="819.8" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="800.5" cy="839.8" r="12" fill="#52798a"/><text x="800.5" y="843.8" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">7</text><text x="882.5" y="867.8" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ร้านเสบียง</text></g><g id="party_board"><title>กระดานประกาศหาเพื่อน/เตรียมMain Quest ไม่ใช่ระบบกิลด์ใหม่</title><rect x="415.5" y="731.8" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="435.5" cy="751.8" r="12" fill="#52798a"/><text x="435.5" y="755.8" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">8</text><text x="517.5" y="779.8" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ลานรวมปาร์ตี้</text></g><g id="council"><title>แสดงเหตุการณ์เผ่าและความคืบหน้าทั้งserver ยังไม่กำหนดอำนาจปกครองใหม่</title><rect x="415.5" y="819.8" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="435.5" cy="839.8" r="12" fill="#52798a"/><text x="435.5" y="843.8" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">9</text><text x="517.5" y="867.8" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">หอสภาหกเผ่า</text></g><g id="artisan"><title>ทางเข้าถึงการฝึกอาวุธ/รวบรวม/ผลิตพื้นฐานสำหรับทุกเผ่า</title><rect x="233.0" y="472.0" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="253.0" cy="492.0" r="12" fill="#52798a"/><text x="253.0" y="496.0" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">10</text><text x="335.0" y="520.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ตรอกฝึกอาชีพ</text></g><g id="kitchen"><title>สถานีทำอาหารและจุดเรียนรู้อาชีพ</title><rect x="233.0" y="560.0" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="253.0" cy="580.0" r="12" fill="#52798a"/><text x="253.0" y="584.0" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">11</text><text x="335.0" y="608.0" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ครัวและลานเตรียมเสบียง</text></g><g id="quay"><title>จุดตกปลาฝึกหัดและพื้นที่สังคม ไม่สร้างบ้านหรือสัตว์ขี่ในรอบนี้</title><rect x="415.5" y="212.2" width="204" height="78" rx="12" fill="#fffdf0" stroke="#809e9b" stroke-width="2"/><circle cx="435.5" cy="232.2" r="12" fill="#52798a"/><text x="435.5" y="236.2" text-anchor="middle" font-size="11" fill="white" font-family="sans-serif">12</text><text x="517.5" y="260.2" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#274858">ท่าและบึงพักเมือง</text></g><g id="root_hall"><rect x="575" y="440" width="250" height="230" rx="35" fill="#c2d4bc" stroke="#456950" stroke-width="4"/><path d="M595 651 Q745 560 600 462 M806 647 Q640 546 800 461 M645 662 Q820 543 647 449" fill="none" stroke="#658b53" stroke-width="15"/><rect x="620" y="500" width="160" height="90" rx="10" fill="#faf6df"/><text x="700" y="529" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#274858">1 · หอผนึกรากโลก</text><text x="700" y="559" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#547061">ลานรวมตัว / ทางเข้าห้องรอ</text><text x="700" y="579" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#547061">Main Quest ของเซิร์ฟเวอร์</text></g><text x="700" y="1032" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#274858">ถนนวงแหวนสำหรับบริการ · ประตู 6 ทิศ · แผงร้านค้าไม่บล็อกถนนหรือทางเข้าหอ</text><text x="700" y="1064" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#547061">แยก zone PvP, collision, props และ navigation เมื่อสร้างฉากจริง · ตำแหน่งอาคารยังปรับได้</text></svg>